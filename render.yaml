services:
  - type: web
    name: syncboard-kanban
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FAIL_RATE
        value: "0"
      - key: MONGODB_URI
        sync: false

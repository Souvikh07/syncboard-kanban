services:
  - type: web
    name: syncboard-kanban
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FAIL_RATE
        value: "0"
      - key: DB_PATH
        value: /data/kanban.db
    disk:
      name: kanban-sqlite-data
      mountPath: /data
      sizeGB: 1
